# Nginx & Docker 构建流水线，推送到 master 分支时自动构建并发布镜像
# 详细说明见：https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go & Docker Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 登录 Docker 仓库（仅 master 推送时执行）
      - name: 登录 Docker 仓库
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 提取 Docker pro 镜像元数据
      - name: 提取 Docker pro 镜像元数据
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: pro-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/liuxinhh/layui-admin-pro
          tags: |
            type=sha,format=short # 使用短 Git SHA 标签（如 7e5f4c1）
            type=ref,event=branch # 分支标签（如 master）
      # 构建并推送 Docker pro 镜像
      - name: 构建并推送 Docker pro 镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .\admin\pro\
          file: .\admin\pro\Dockerfile  # 同样指向该 Dockerfile
          push: true
          tags: ${{ steps.pro-meta.outputs.tags }}
          labels: ${{ steps.pro-meta.outputs.labels }}

      # 提取 Docker std 镜像元数据
      - name: 提取 Docker std 镜像元数据
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: std-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/liuxinhh/layui-admin-std
          tags: |
            type=sha,format=short # 使用短 Git SHA 标签（如 7e5f4c1）
            type=ref,event=branch # 分支标签（如 master）
      # 构建并推送 Docker 镜像
      - name: 构建并推送 Docker std 镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .\admin\std\
          file: .\admin\std\Dockerfile  # 同样指向该 Dockerfile
          push: true
          tags: ${{ steps.std-meta.outputs.tags }}
          labels: ${{ steps.std-meta.outputs.labels }}
